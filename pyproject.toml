[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "traffic-accidents"
version = "0.0.1"
description = "Estudio de accidentes de tr\u00e1fico en M\u00e9xico"
authors = [
  { name = "Universidad de Sonora" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["traffic-accidents"]
include = ["pyproject.toml", "traffic-accidents/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["traffic-accidents"]
force-sort-within-sections = true

